[project]
name = "policynim-nemo-coding-workflow"
version = "0.1.0"
description = "Hosted PolicyNIM + NVIDIA NeMo coding workflow demo."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mcp==1.26.0",
  "nvidia-nat[eval,langchain,mcp]==1.6.0",
  "openai==2.29.0",
  "pydantic==2.12.5",
  "pydantic-settings==2.13.1",
  "typer==0.24.1",
]

[project.scripts]
workflow-demo = "policynim_nemo_workflow.cli:app"

[project.entry-points."nat.components"]
policynim_nemo_workflow = "policynim_nemo_workflow.nat_register"

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "ruff==0.15.7",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policynim_nemo_workflow"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: tests that call hosted PolicyNIM MCP or NVIDIA NIM and are excluded from offline CI",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
